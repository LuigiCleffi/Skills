# Publishes to npm on every push to main whose package.json version is not on
# npm yet, then tags the commit v<version> and creates a GitHub release. A push
# that does not change the version publishes nothing, so releasing is: bump
# the version in a pull request, merge it.
#
#   npm version minor --no-git-tag-version   # in the pull request
#
# Publishing uses npm trusted publishing, with no token: on npmjs.com, the
# package's Settings → Trusted Publisher names GitHub Actions, this repository
# (LuigiCleffi/Skills), the workflow file release.yml, and no environment. npm
# exchanges the job's OIDC token for a short-lived publish token, so the job
# sets up no .npmrc token for it to fall back to.
# Provenance links each published version to the commit that built it.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the version tag and create the release
  id-token: write # provenance and trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find whether this version is already on npm
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Use an npm that supports trusted publishing
        if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@11
      - if: steps.version.outputs.publish == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.version.outputs.publish == 'true'
        run: npm run check:frontmatter
      - if: steps.version.outputs.publish == 'true'
        run: npm test
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public --ignore-scripts
      - name: Tag the commit and create the GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
